<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction d’immeubles au Maroc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{--ink:#0f2f2e;--text:#3f5654;--muted:#6a807d;--soft:#f4faf8;--paper:#fff;--line:#dcebe7;--brand:#0a7f76;--brand-d:#075f59;--dark:#0d2b2a;--glass:rgba(255,255,255,.75);--grad:linear-gradient(135deg,#0a7f76,#2cc3b0);--shadow:0 24px 60px rgba(15,47,46,.12);
--font:"Plus Jakarta Sans","Cairo","Segoe UI",Arial,sans-serif}
:root[data-theme="dark"]{--ink:#eaf7f5;--text:#b4cdc9;--muted:#85a29d;--soft:#0b1a19;--paper:#112625;--line:#1f3b39;--brand:#4fd1c0;--brand-d:#7fe3d6;--dark:#071211;--glass:rgba(17,38,37,.72);--shadow:0 24px 60px rgba(0,0,0,.45)}
[lang="ar"]{--font:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--text);background:var(--soft);line-height:1.7;font-size:17px;transition:background .3s,color .3s}
h1,h2,h3{color:var(--ink);line-height:1.12;font-weight:800}
html:not([lang="ar"]) h1,html:not([lang="ar"]) h2{letter-spacing:-.025em}
html:not([lang="ar"]) h1,html:not([lang="ar"]) h2{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:700}
h2{font-size:clamp(2rem,4.5vw,3.3rem);margin-bottom:14px}
h3{font-size:1.2rem;margin-bottom:6px}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:24px}
section{padding:110px 0}
.lead{max-width:58ch;color:var(--muted);font-size:1.08rem;margin-bottom:48px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:60;background:var(--grad);transform-origin:0 50%;transform:scaleX(0)}
html[dir="rtl"] .progress{transform-origin:100% 50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#0a7f76;color:#fff;font:700 1rem var(--font);padding:14px 28px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;box-shadow:0 10px 24px rgba(10,127,118,.35);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{background:#075f59;transform:translateY(-2px);box-shadow:0 14px 30px rgba(10,127,118,.45)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--paper);border-color:var(--brand)}

header{position:sticky;top:12px;z-index:40;padding:0 16px;margin-top:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1160px;margin-inline:auto;padding:10px 12px 10px 22px;padding-inline:22px 12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;transition:box-shadow .3s}
header.sc .bar{box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:none}
.logo svg{width:28px;height:28px;color:var(--brand)}
nav{display:flex;gap:6px;align-items:center}
nav a{text-decoration:none;font-weight:600;color:var(--text);padding:8px 14px;border-radius:999px;font-size:.95rem}
nav a:hover,nav a[aria-current]{background:var(--soft);color:var(--brand)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{font:700 .85rem var(--font);background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--muted);border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.theme{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.theme svg{width:20px;height:20px}
@media(max-width:980px){nav{display:none}}

.hero,.pagehero{position:relative;overflow:hidden;background:var(--soft)}
.hero{padding:110px 0 210px;margin-top:-76px;padding-top:190px}
.pagehero{padding:170px 0 80px;margin-top:-76px}
.hero::before,.pagehero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 30% 30%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 30% 30%,#000 5%,transparent 70%);opacity:.8}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
.b1{width:440px;height:440px;background:#9fe8da;top:-60px;inset-inline-start:-100px}
.b2{width:380px;height:380px;background:#ffcf9f;bottom:0;inset-inline-end:6%}
:root[data-theme="dark"] .blob{opacity:.28}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.hero h1,.pagehero h1{font-size:clamp(2.6rem,6.2vw,4.9rem);margin-bottom:22px;color:var(--ink);background:linear-gradient(120deg,var(--ink) 35%,var(--brand) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;max-width:15ch}
.hero p,.pagehero p{max-width:52ch;font-size:1.18rem;margin-bottom:34px;color:var(--text)}
.pagehero .wrap{position:relative;z-index:1}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.sky{position:absolute;inset-inline:0;bottom:0;width:100%;height:170px;opacity:.9}
:root[data-theme="dark"] .sky{opacity:.12}

.slider{position:relative;aspect-ratio:16/10;border-radius:28px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:0 30px 80px rgba(10,127,118,.25)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide svg,.slide img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;inset-inline:0;bottom:0;padding:60px 22px 42px;color:#fff;font-weight:700;font-size:1.15rem;background:linear-gradient(transparent,rgba(13,43,42,.85))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0f2f2e;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.nav svg{width:20px;height:20px}
.prev{inset-inline-start:14px}.next{inset-inline-end:14px}
.next svg{transform:scaleX(-1)}
html[dir="rtl"] .prev svg{transform:scaleX(-1)}
html[dir="rtl"] .next svg{transform:none}
.dots{position:absolute;bottom:16px;inset-inline:0;display:flex;justify-content:center;gap:8px}
.dots button{width:10px;height:10px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.6);cursor:pointer;transition:width .25s}
.dots button[aria-current="true"]{width:28px;background:#fff}
:root[data-theme="dark"] .slide svg,:root[data-theme="dark"] .thumb svg,:root[data-theme="dark"] .photo svg{filter:brightness(.8)}

.stats{padding:0;position:relative;z-index:2;margin-top:-84px}
.stats .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;padding:12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);max-width:1112px}
.stats .wrap>div{padding:20px 24px;border-inline-start:1px solid var(--line)}
.stats .wrap>div:first-child{border-inline-start:0}
.stats b{display:block;font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.25}
.stats span{color:var(--muted);font-size:.93rem}
section.stats~section:first-of-type{padding-top:90px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
#services .grid{grid-template-columns:repeat(6,1fr)}
#services .card{grid-column:span 2}
#services .card:nth-child(1),#services .card:nth-child(4){grid-column:span 4}
#services .card:nth-child(1) .thumb,#services .card:nth-child(4) .thumb{aspect-ratio:21/9}
@media(max-width:860px){#services .grid{grid-template-columns:1fr}#services .card,#services .card:nth-child(n){grid-column:auto}#services .card .thumb{aspect-ratio:16/9!important}}
.card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:22px 22px 26px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(10,127,118,.16),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--brand)}
.card:hover::before{opacity:1}
.card:focus-within{outline:3px solid var(--brand);outline-offset:3px}
.card p{color:var(--muted);font-size:.98rem}
.thumb{aspect-ratio:16/9;overflow:hidden;border-radius:18px;margin:0 0 18px;background:var(--soft)}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover .thumb svg,.card:hover .thumb img{transform:scale(1.05)}
.more{background:none;border:0;padding:0;margin-top:14px;font:700 .95rem var(--font);color:var(--brand);cursor:pointer}
.more::after{content:"";position:absolute;inset:0}
.more:focus-visible{outline:none}

.photo{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/3;background:var(--paper);margin:0;border:1px solid var(--line)}
.photo svg,.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.photo:hover svg,.photo:hover img{transform:scale(1.06)}
.photo figcaption{position:absolute;inset-inline:0;bottom:0;padding:56px 20px 18px;color:#fff;font-weight:700;background:linear-gradient(transparent,rgba(13,43,42,.88))}
.photo small{display:block;font-weight:400;opacity:.85}

.why{background:var(--paper);border-block:1px solid var(--line)}
.why ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.why li{padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--soft)}
.why p{color:var(--muted);font-size:.98rem}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;counter-reset:s}
.steps li{counter-increment:s;padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--soft)}
.steps li::before{content:"0" counter(s);display:block;font:800 2.6rem var(--font);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;line-height:1}
.steps p{color:var(--muted);font-size:.98rem}

.split{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
@media(max-width:800px){.split{grid-template-columns:1fr;gap:32px}}
.split p{margin-bottom:14px}
.av{width:72px;height:72px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin-bottom:14px;color:var(--brand)}
.av svg{width:38px;height:38px}
.cta{background:linear-gradient(135deg,#075f59,#0a7f76 60%,#2cc3b0);color:#fff;text-align:center;padding:90px 0}
.cta h2{color:#fff}
.cta .btn{background:#fff;color:#0f2f2e;box-shadow:none;margin-top:14px}
.cta .btn:hover{background:var(--soft)}

.contact{background:radial-gradient(900px 420px at 85% 0%,rgba(44,195,176,.28),transparent 70%),radial-gradient(700px 380px at 0% 100%,rgba(244,162,89,.18),transparent 70%),var(--soft);color:var(--text);border-top:1px solid var(--line)}
.contact h2{color:var(--ink)}
.contact a{color:var(--brand);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1.15fr;gap:56px}
@media(max-width:860px){.cols{grid-template-columns:1fr;gap:32px}}
.info{display:grid;gap:12px;margin-top:22px}
form{background:var(--paper);color:var(--text);border-radius:28px;padding:30px;display:grid;gap:16px;box-shadow:var(--shadow)}
label{display:grid;gap:6px;font-weight:700;color:var(--ink);font-size:.93rem}
input,select,textarea{font:400 1rem var(--font);padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(10,127,118,.2)}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.status{min-height:1.5em;font-weight:700;color:var(--brand)}
.wa{position:fixed;inset-block-end:20px;inset-inline-end:20px;z-index:50;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .2s}
.wa:hover{transform:scale(1.08)}
.wa svg{width:32px;height:32px}
.wa-btn{background:#128c7e;box-shadow:none;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.wa-btn:hover{background:#0e7066;box-shadow:none}
.wa-btn svg{width:22px;height:22px}
footer{padding:34px 0;font-size:.92rem;color:var(--muted);background:var(--soft)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.legal{flex-basis:100%;font-size:.85rem}

dialog{border:1px solid var(--line);border-radius:28px;padding:30px;width:calc(100% - 32px);max-width:580px;background:var(--paper);color:var(--text);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(13,43,42,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
dialog .head h2{font-size:1.7rem;margin:0}
dialog .close{background:var(--soft);border:0;width:38px;height:38px;border-radius:50%;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--ink)}
dialog ul{list-style:none;padding:0;margin:18px 0 24px;display:grid;gap:10px}
dialog li{padding-inline-start:28px;position:relative}
dialog li::before{content:"";position:absolute;inset-inline-start:0;top:.5em;width:12px;height:12px;background:var(--grad);border-radius:50%}

.hero-bg{position:absolute;inset:0;background:url("images/hero-bg.jpg") center/cover no-repeat}
.hero-ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(var(--soft-rgb),.96) 0%,rgba(var(--soft-rgb),.82) 45%,rgba(var(--soft-rgb),.3) 100%)}
html[dir="rtl"] .hero-ov{transform:scaleX(-1)}
@media(max-width:900px){.hero-ov{background:rgba(var(--soft-rgb),.86)}}
:root{--soft-rgb:244,250,248}
:root[data-theme="dark"]{--soft-rgb:11,26,25}
.hero h1{white-space:pre-line;font-size:clamp(2.4rem,5.4vw,4.2rem);max-width:20ch}
.thumb{position:relative}
body.slots [data-slot]{outline:3px dashed #ff3b3b;outline-offset:-3px}
body.slots [data-slot]::after{content:attr(data-slot);position:absolute;top:8px;inset-inline-start:8px;z-index:5;background:#ff3b3b;color:#fff;font:700 12px/1.3 monospace;padding:4px 8px;border-radius:6px;white-space:nowrap;direction:ltr}
.js .rv{opacity:0;translate:0 26px;transition:opacity .8s ease,translate .8s ease}
.js .rv.in{opacity:1;translate:none}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1;translate:none;transition:none}.slide{transition:none}html{scroll-behavior:auto}}
.burger{display:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);place-items:center;cursor:pointer}
.burger svg{width:20px;height:20px}
@media(max-width:980px){
  .burger{display:grid}
  header.open nav{display:flex;flex-direction:column;align-items:stretch;position:absolute;top:calc(100% + 8px);inset-inline:16px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow)}
}
.hero-bg img{width:100%;height:100%;object-fit:cover;display:block}
.slide img+svg,.thumb img+svg,.photo img+svg{display:none}
</style>
<script>document.documentElement.className+=" js"</script>
</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- Shared window pattern used by the illustrations -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
  <pattern id="win" width="16" height="22" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="8" height="11" fill="#fff" opacity=".75"/></pattern>
</defs></svg>

<header>
  <div class="bar">
    <a class="logo" href="#top">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 21V9l6-3v15zM11 21V3l10 4v14z"/></svg>
      <span data-t="brand"></span>
    </a>
    <nav id="nav" aria-label="Main">
      <a href="#services" data-t="n_services"></a>
      <a href="#projects" data-t="n_projects"></a>
      <a href="#why" data-t="n_why"></a>
      <!-- <a href="about.html" data-t="n_about"></a> -->
      <a href="#contact" data-t="n_contact"></a>
    </nav>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="fr" aria-pressed="true">FR</button>
        <button data-lang="ar" aria-pressed="false">العربية</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="theme" id="theme" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18z"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="sr" data-t="theme"></span></button>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="sr" data-t="m_menu"></span></button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <!-- ===== IMAGE 1: HERO BACKGROUND (first page) =====
         Put your photo at: images/hero-bg.jpg  (landscape, 1920x1080 or larger, under 400 KB)
         To use another file name, change url("images/hero-bg.jpg") in the CSS rule .hero-bg -->
    <div class="hero-bg" data-slot="images/hero-bg.jpg · 1920×1080"><img src="images/hero-bg.png" alt="" onerror="this.remove()"></div><div class="hero-ov"></div>
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="wrap">
      <div>
      <h1 data-t="h1"></h1>
      <p data-t="hero_p"></p>
      <div class="actions">
        <a class="btn" href="#contact" data-t="cta1"></a>
        <a class="btn ghost" href="#projects" data-t="cta2"></a>
      </div>
      </div>
      <!-- ===== IMAGES 2-4: HERO SLIDER =====
           Put your photos at: images/slide-1.jpg, images/slide-2.jpg, images/slide-3.jpg  (1600x1000, under 300 KB each)
           They replace the drawings automatically. For more than 3 photos, use the SLIDES variable in the script -->

var L=["fr","en","ar"];
function setLang(l){
  var i=L.indexOf(l);if(i<0){l="fr";i=0;}
  document.documentElement.lang=l;
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=D[e.dataset.t][i];});
  document.title=D.title[i];
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===l);});
  try{localStorage.setItem("lang",l);}catch(e){}
  waLink();
  if(dlg&&dlg.open)fillSvc();
}
document.querySelectorAll("[data-lang]").forEach(function(b){b.onclick=function(){setLang(b.dataset.lang);};});
// ===== IMAGES: just drop files with these names in the images/ folder and they appear automatically =====
// hero background: images/hero-bg.jpg | slider: slide-1..3.jpg | services: service-1..4.jpg | projects: project-1..3.jpg
// Tip: open the page with ?slots at the end of the address (index.html?slots) to see a red label on every image spot
var IMG={1:"",2:"",3:"",4:""}; // optional: force another path for a service, e.g. 1:"images/my-photo.jpg"
function swap(el,src){var s=el&&el.querySelector("svg");if(!s)return;var im=new Image();im.alt="";im.src=src;s.replaceWith(im);}
function probe(src,get){var t=new Image();t.onload=function(){swap(typeof get==="function"?get():get,src);};t.src=src;}
document.querySelectorAll(".thumb[data-img]").forEach(function(t){probe(IMG[t.dataset.img]||"images/service-"+t.dataset.img+".jpg",t);});
document.querySelectorAll("#projects .photo").forEach(function(f,i){probe("images/project-"+(i+1)+".jpg",f);});
[1,2,3].forEach(function(n){probe("images/slide-"+n+".jpg",function(){return document.querySelectorAll(".slide")[n-1];});});
if(/[?&]slots/.test(location.search))document.body.classList.add("slots");
var cur="1",dlg=document.getElementById("svcModal");
function fillSvc(){
  var i=L.indexOf(document.documentElement.lang),ul=document.getElementById("svcList");
  document.getElementById("svcTitle").textContent=D["sv"+cur][i];
  document.getElementById("svcText").textContent=D["svd"+cur][i];
  ul.innerHTML="";
  D["svl"+cur][i].split("|").forEach(function(t){var li=document.createElement("li");li.textContent=t;ul.appendChild(li);});
}
document.querySelectorAll("[data-svc]").forEach(function(b){
  b.addEventListener("click",function(){cur=b.dataset.svc;document.getElementById("svcImg").innerHTML=document.querySelector('.thumb[data-img="'+cur+'"]').innerHTML;fillSvc();dlg.showModal();});
});
dlg.addEventListener("click",function(e){if(e.target===dlg||e.target.closest("[data-close]"))dlg.close();});
// Slider photos: add your own images, e.g. var SLIDES=["images/slide-1.jpg","images/slide-2.jpg","images/slide-3.jpg"];
var SLIDES=[];
(function(){
  var box=document.getElementById("slider");
  if(SLIDES.length){
    var capKeys=["sv2","sv1","sv3"];
    box.querySelectorAll(".slide").forEach(function(x){x.remove();});
    SLIDES.forEach(function(src,i){
      var d=document.createElement("div");d.className="slide";
      d.innerHTML='<img src="'+src+'" alt="" loading="'+(i?"lazy":"eager")+'">'+(capKeys[i]?'<div class="cap" data-t="'+capKeys[i]+'"></div>':"");
      box.insertBefore(d,box.querySelector(".nav"));
    });
  }
  var sl=box.querySelectorAll(".slide"),dots=document.getElementById("dots"),cur=0,timer=null;
  sl.forEach(function(_,i){
    var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",(i+1)+" / "+sl.length);
    b.onclick=function(){go(i);};dots.appendChild(b);
  });
  function go(n){
    cur=(n+sl.length)%sl.length;
    sl.forEach(function(x,i){x.classList.toggle("on",i===cur);x.setAttribute("aria-hidden",i!==cur);});
    dots.querySelectorAll("button").forEach(function(b,i){b.setAttribute("aria-current",i===cur);});
  }
  function stop(){if(timer){clearInterval(timer);timer=null;}}
  function play(){
    if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    stop();timer=setInterval(function(){go(cur+1);},5000);
  }
  box.querySelector(".prev").onclick=function(){go(cur-1);};
  box.querySelector(".next").onclick=function(){go(cur+1);};
  box.addEventListener("mouseenter",stop);box.addEventListener("mouseleave",play);
  box.addEventListener("focusin",stop);box.addEventListener("focusout",play);
  var x0=null;
  box.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;stop();},{passive:true});
  box.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0,rtl=document.documentElement.dir==="rtl";
    if(Math.abs(dx)>40)go(cur+((dx<0)!==rtl?1:-1));
    x0=null;play();
  });
  go(0);play();
})();

// Advanced UI: theme toggle, scroll progress, reveal on scroll, card glow
(function(){
  var r=document.documentElement,t="light";
  try{t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}catch(e){}
  r.setAttribute("data-theme",t);
  document.getElementById("theme").onclick=function(){
    var n=r.getAttribute("data-theme")==="dark"?"light":"dark";
    r.setAttribute("data-theme",n);try{localStorage.setItem("theme",n);}catch(e){}
  };
  var pg=document.getElementById("progress"),hd=document.querySelector("header");
  function sc(){var h=r.scrollHeight-innerHeight;pg.style.transform="scaleX("+(h>0?scrollY/h:0)+")";hd.classList.toggle("sc",scrollY>10);}
  addEventListener("scroll",sc,{passive:true});sc();
  var els=document.querySelectorAll(".card,.photo,.steps li,.why li,.stats .wrap>div,main h2,.lead,.split>*,.cols>*");
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.12});
    els.forEach(function(e){
      e.classList.add("rv");
      e.style.transitionDelay=(Array.prototype.indexOf.call(e.parentNode.children,e)%4*80)+"ms";
      io.observe(e);
    });
  }
  document.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("pointermove",function(e){var b=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-b.left)+"px");c.style.setProperty("--my",(e.clientY-b.top)+"px");});
  });
})();

// Contact form: sends the message by email (formsubmit.co, no server needed)
var MAIL_TO="testgm65@gmail.com";
document.querySelector("form").addEventListener("submit",function(e){
  e.preventDefault();
  var f=this,st=f.querySelector(".status"),btn=f.querySelector('button[type="submit"]'),
      i=L.indexOf(document.documentElement.lang),fd=new FormData(f);
  fd.append("langue",document.documentElement.lang);
  btn.disabled=true;st.textContent=D.f_wait[i];
  fetch("https://formsubmit.co/ajax/"+MAIL_TO,{method:"POST",headers:{"Accept":"application/json"},body:fd})
    .then(function(r){return r.json();})
    .then(function(d){if(d.success===true||d.success==="true"){st.textContent=D.f_ok[i];f.reset();}else{throw 0;}})
    .catch(function(){st.textContent=D.f_err[i];})
    .then(function(){btn.disabled=false;});
});
